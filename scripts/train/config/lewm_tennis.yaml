defaults:
  - launcher: local
  - data: tennis
  - _self_          # last, so this file's wandb block overrides launcher/local.yaml's

output_model_name: lewm_tennis
subdir: ${hydra:job.id}

# wandb enabled by default for this config (launcher/local.yaml disables it).
# entity must be YOUR wandb account, not the upstream `stable-wm` team.
wandb:
  enabled: true
  config:
    entity: ssaurav3425-iiser-bhopal   # your wandb default entity (not the HF username)
    project: tennis-jepa
    name: ${output_model_name}
    id: ${subdir}
    resume: allow
    log_model: False

num_workers: 6
train_split: 0.9
seed: 3072
# 128px so the small/fast Tennis ball survives the resize (at 64px it was sub-pixel).
img_size: 128
# patch 8 -> 16x16 = 256 tokens at 128px. Small patches keep the tiny ball from being
# averaged into a coarse token (bigger patches would hurt small-object retention).
patch_size: 8
encoder_scale: tiny
embed_dim: 192
encoder_resnet9: False
train_value_function: False
projector_loss_weight: 1e-3
dump_object: True

trainer:
  max_epochs: 100
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

loader:
  batch_size: 1
  num_workers: ${num_workers}
  drop_last: True
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True
  shuffle: True

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

wm:
  history_size: 3
  num_preds: 3

model:
  _target_: stable_worldmodel.wm.lewm.LeWM
  encoder:
    _target_: stable_pretraining.backbone.utils.vit_hf
    size: ${encoder_scale}
    patch_size: ${patch_size}
    image_size: ${img_size}
    pretrained: false
    use_mask_token: false
  predictor:
    _target_: stable_worldmodel.wm.lewm.module.Predictor
    num_frames: ${wm.history_size}
    input_dim: ${embed_dim}
    hidden_dim: ${embed_dim}
    output_dim: ${embed_dim}
    depth: 6
    heads: 16
    mlp_dim: 2048
    dim_head: 64
    dropout: 0.1
    emb_dropout: 0.0
  action_encoder:
    _target_: torch.nn.Embedding
    num_embeddings: 18  # ALE Tennis is Discrete(18), not 6 like Pong
    embedding_dim: ${embed_dim}
  projector:
    _target_: stable_worldmodel.wm.lewm.module.MLP
    input_dim: ${embed_dim}
    output_dim: ${embed_dim}
    hidden_dim: 2048
    norm_fn:
      _target_: torch.nn.BatchNorm1d
      _partial_: true
  pred_proj:
    _target_: stable_worldmodel.wm.lewm.module.MLP
    input_dim: ${embed_dim}
    output_dim: ${embed_dim}
    hidden_dim: 2048
    norm_fn:
      _target_: torch.nn.BatchNorm1d
      _partial_: true

loss:
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024
